name: Change request
description: Ask for something on the site to be added or changed.
title: "Change: "
labels: ["change request"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to change?
      description: Describe it the way a shopper would notice it.
      placeholder: Show the delivery time under the Add to Cart button on every product.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve for shoppers or the team?
  - type: input
    id: where
    attributes:
      label: Which page?
      placeholder: Product page, home page, cart, all pages…
  - type: input
    id: design
    attributes:
      label: Figma link (if there is a design)
  - type: dropdown
    id: urgency
    attributes:
      label: How urgent is it?
      options:
        - Nice to have
        - Needed for an upcoming campaign or launch
        - Blocking sales
    validations:
      required: true
